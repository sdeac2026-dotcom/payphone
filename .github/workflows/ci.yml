name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Rust engine — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Unit tests
        run: cargo test --release
        working-directory: engine
      - name: Build release binary
        run: cargo build --release
        working-directory: engine

  console:
    name: Next.js console — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  oracle:
    name: Pricing oracle — smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/oracle-py/requirements.txt
      - name: Import & boot check
        run: |
          python3 -c "import sys; sys.path.insert(0, 'services/oracle-py'); import main; assert main.app is not None"
          echo "oracle module OK"

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Move API routes aside (route handlers cannot exist in a static export)
        run: |
          if [ -d src/app/api ]; then mv src/app/api .api-backup; fi
      - name: Build (in-browser demo engine, project base path)
        run: bunx next build
        env:
          PAYPHONE_STATIC_EXPORT: "1"
          PAYPHONE_BASE_PATH: /payphone
          NEXT_PUBLIC_PAYPHONE_DEMO: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

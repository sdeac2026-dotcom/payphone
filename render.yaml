# Render Blueprint — PayPhone (engine + oracle + web console, one container).
#
# Deploy in one click:  https://render.com/deploy?repo=https://github.com/sdeac2026-dotcom/payphone
# (or Render Dashboard → New → Blueprint → pick the repo → Apply)
#
# Zero required inputs: the four secrets below are generated by Render at
# apply time, and the engine mirrors the request Host when
# PAYPHONE_CHECKOUT_URL is unset — so payment links automatically point at
# your Render URL (e.g. https://payphone.onrender.com).
#
# Real-money note: the Free plan sleeps after ~15 idle minutes — a sleeping
# checkout page is unacceptable for live payments. `plan: starter` keeps it
# always on; switch to `free` in the deploy form if you are still testing
# and upgrade before real volume.
#
# Optional hardening AFTER the first deploy (Environment tab):
#   PAYPHONE_CHECKOUT_URL  = your canonical public URL (custom domains)
#   PAYPHONE_CORS_ORIGINS  = that same URL (locks the API to your origin)

services:
  - type: web
    name: payphone
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PAYPHONE_ENV
        value: production
      - key: PAYPHONE_MASTER_KEY
        generateValue: true
      - key: PAYPHONE_SIGNING_KEY
        generateValue: true
      - key: PAYPHONE_PHONE_PEPPER
        generateValue: true
      - key: PAYPHONE_ADMIN_TOKEN
        generateValue: true
